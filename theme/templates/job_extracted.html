{% extends 'base.html' %}

{% block body %}
    <div class="flex flex-col gap-4">
        <h1 class="text-3xl">Donnée extraite du job #{{ job.id }}</h1>

        <p>Commande: {{ job.raw_command }}</p>
        <p>Chunks reçus: {{ job.chunks_received_count }} chunks</p>

        <div class="flex flex-col gap-3">
            <p>Fichiers :</p>
            <pre class="bg-gray-200 p-2 rounded"><code>{{ files_tree }}</code></pre>
        </div>

        <div class="flex flex-col gap-3">
            <p>Données :</p>
            <pre class="bg-gray-200 p-2 rounded"><code>{{ extracted }}</code></pre>
        </div>
{% endblock %}
