{% extends 'base.html' %}

{% block body %}
    <div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
        <div class="bg-white rounded-xl p-8 border border-surface-container-high shadow-sm flex flex-col justify-between h-72">
            <div class="flex justify-between items-start">
                <div class="flex flex-col gap-2">
                    <h2 class="text-headline-lg text-on-surface">Machines contrôlées</h2>
                </div>
                <div class="p-3 bg-surface-container-low rounded-xl text-primary">
                    <span class="mdi mdi-laptop text-[28px]"></span>
                </div>
            </div>
            <div class="flex items-baseline gap-4">
                <span class="text-[80px] font-bold leading-none text-primary">{{ machinesCount }}</span>
            </div>
            <div class="pt-4 border-t border-surface-container-low">
                <a class="text-body-sm font-bold text-primary hover:text-surface-tint flex items-center gap-2 group transition-colors"
                   href="/machines">
                    Consulter
                    <span class="mdi mdi-arrow-right text-[18px] group-hover:translate-x-1 transition-transform"></span>
                </a>
            </div>
        </div>

        <div class="bg-white rounded-xl p-8 border border-surface-container-high shadow-sm flex flex-col justify-between h-72">
            <div class="flex justify-between items-start">
                <div class="flex flex-col gap-2">
                    <h2 class="text-headline-lg text-on-surface">Tâches en cours</h2>
                </div>
                <div class="p-3 bg-surface-container-low rounded-xl text-primary">
                    <span class="mdi mdi-cog-play text-[28px]"></span>
                </div>
            </div>
            <div class="flex items-baseline gap-4">
                <span class="text-[80px] font-bold leading-none text-primary">{{ jobsCount }}</span>
            </div>
            <div class="pt-4 border-t border-surface-container-low">
                <a class="text-body-sm font-bold text-primary hover:text-surface-tint flex items-center gap-2 group transition-colors"
                   href="#">
                    Consulter
                    <span class="mdi mdi-arrow-right text-[18px] group-hover:translate-x-1 transition-transform"></span>
                </a>
            </div>
        </div>
    </div>
{% endblock %}
