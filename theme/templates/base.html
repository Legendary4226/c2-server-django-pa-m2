{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <title>PA - C2</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    {% tailwind_css %}
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font/css/materialdesignicons.min.css" rel="stylesheet">
</head>

<body class="flex min-h-screen">
<aside class="flex flex-col h-full fixed left-0 top-0 z-40 bg-white border-r border-surface-container-high w-64">
        <div class="p-lg flex flex-col gap-lg h-full">
            <div class="flex flex-col gap-1">
                <span class="text-title-md font-bold text-primary">PA - C2</span>
                <span class="text-label-caps text-on-surface-variant uppercase tracking-widest">Système Actif</span>
            </div>
            <nav class="flex flex-col gap-1 mt-4">
                <a class="px-4 py-3 rounded-xl flex items-center gap-3 transition-all {% if request.path == '/' %}bg-surface-container-low text-primary{% endif %}"
                   href="/">
                    <span class="mdi mdi-view-dashboard"></span>
                    <span class="font-medium">Dashboard</span>
                </a>
                <a class="px-4 py-3 rounded-xl flex items-center gap-3 transition-all {% if request.path == '/machines' %}bg-surface-container-low text-primary{% endif %}"
                   href="/machines">
                    <span class="mdi mdi-laptop"></span>
                    <span class="font-medium">Machines</span>
                </a>
                <a class="px-4 py-3 rounded-xl flex items-center gap-3 transition-all {% if request.path == '/jobs' %}bg-surface-container-low text-primary{% endif %}"
                   href="/jobs">
                    <span class="mdi mdi-cog-play"></span>
                    <span class="font-medium">Jobs</span>
                </a>
                <a class="px-4 py-3 rounded-xl flex items-center gap-3 transition-all {% if request.path == '/debug' %}bg-surface-container-low text-primary{% endif %}"
                   href="/debug">
                    <span class="mdi mdi-bug"></span>
                    <span class="font-medium">Debug</span>
                </a>
            </nav>
        </div>
    </aside>

<main class="ml-64 flex-1 flex flex-col min-h-screen">
        <!-- Top Navigation -->
        <header class="flex justify-between items-center w-full px-lg h-20 bg-white border-b border-surface-container-high sticky top-0 z-30">
            <div class="flex items-center gap-lg">
                <h1 class="text-headline-lg font-bold text-on-surface">Mission Control</h1>
            </div>
            <div class="flex items-center gap-sm">
            </div>
        </header>

        <section class="p-lg max-w-7xl mx-auto w-full">
        {% block body %}{% endblock %}
        </section>
    </main>
</body>
</html>
